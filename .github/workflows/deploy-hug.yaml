name: Deploy Hugo Site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'hugo.toml'
      - 'hugo.yaml'
      - 'hugo.yml'
      - 'hugo.json'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/hugo-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive
      
      - name: Check out PDF archive
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: archive

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Copy archived PDFs into Hugo
        run: |
          mkdir -p site/static/latex_files
          cp archive/latex_files/*.pdf site/static/latex_files/

      - name: Build Hugo site
        working-directory: site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          base="$BASE_URL"
          [[ "$base" == */ ]] || base="$base/"
          hugo --minify --baseURL "$base"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
