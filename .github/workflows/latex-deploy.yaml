name: Publish LaTeX to Hugo

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
# Compile the exact source version identified by the tag.
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          path: source

      - name: Resolve document from tag
        id: doc
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%-v*}"
          version="${TAG##*-v}"

          if [[ "$name" == "$TAG" || -z "$version" ]]; then
            echo "Expected tag: filename-vVERSION"
            exit 1
          fi

          file="latex_files/$name/main.tex"

          if [[ ! -f "source/$file" ]]; then
            echo "Document not found: $file"
            exit 1
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Compile LaTeX with latexmk
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ steps.doc.outputs.file }}
          working_directory: source
          work_in_root_file_dir: true

# The persistent archive is separate from the source branch.
      - name: Check out PDF archive
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: archive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PDF archive
        working-directory: archive
        shell: bash
        env:
          NAME: ${{ steps.doc.outputs.name }}
          VERSION: ${{ steps.doc.outputs.version }}
          FILE: ${{ steps.doc.outputs.file }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p latex_files

          cp "../source/$(dirname "$FILE")/main.pdf" "latex_files/$NAME.pdf"
          cp "../source/$(dirname "$FILE")/main.pdf" "latex_files/$NAME-$VERSION.pdf"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add latex_files/

          if ! git diff --cached --quiet; then
            git commit -m "Publish $NAME $VERSION ($TAG)"
            git push origin HEAD:gh-pages
          fi

# Always build the website using the latest Hugo sources on main.    
      - name: Check out current site source
        uses: actions/checkout@v6
        with:
          ref: main
          path: site-source
          fetch-depth: 0
          submodules: recursive

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Copy archived PDFs into Hugo
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site-source/site/static/latex_files
          if compgen -G "archive/latex_files/*.pdf" > /dev/null; then
            cp archive/latex_files/*.pdf site-source/site/static/latex_files/
            echo "Copied PDF files\n"
            echo "PDF files: ${ls -ahl site-source/site/static/latex_files}"
          else
            echo "No PDFs found in archive/latex_files/"
            find archive -type f -name '*.pdf'
          fi
          echo "PDFs copied into Hugo static directory:"
          find site-source/site/static/latex_files -maxdepth 1 -type f -name '*.pdf' -print
          
      - name: Generate posts from LaTeX directories
        shell: bash
        run: |
          set -euo pipefail
          python3 site-source/.github/scripts/generate_hugo_posts.py site-source

      - name: Generate PDF lists for project posts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("site-source")
          posts_dir = root / "site" / "content" / "posts"
          pdf_dir = root / "site" / "static" / "latex_files"

          def version_key(path):
              match = re.search(r"-v(\d+(?:\.\d+)*)$", path.stem)
              if not match:
                  return ()
              return tuple(int(part) for part in match.group(1).split("."))

          def project_name(pdf):
              match = re.match(r"(.+)-v\d+(?:\.\d+)*$", pdf.stem)
              return match.group(1) if match else None

          pdfs_by_project = {}
          for pdf in pdf_dir.glob("*.pdf"):
              project = project_name(pdf)
              if project:
                  pdfs_by_project.setdefault(project, []).append(pdf)

          for post in posts_dir.glob("*.md"):
              project = post.stem
              pdfs = pdfs_by_project.get(project, [])
              if not pdfs:
                  continue

              # Sort numeric versions descending, e.g. v2.1 before v1.3.
              pdfs.sort(key=version_key, reverse=True)

              content = post.read_text(encoding="utf-8")
              marker = "<!-- PDF_LIST_START -->"
              end_marker = "<!-- PDF_LIST_END -->"

              # Replace an existing generated list, if present.
              if marker in content and end_marker in content:
                  before = content.split(marker, 1)[0]
                  after = content.split(end_marker, 1)[1]
              else:
                  before = content.rstrip() + "\n\n"
                  after = "\n"

              lines = [marker, "## PDF versions", ""]
              for pdf in pdfs:
                  url = "/Latex_stuff/latex_files/" + pdf.name
                  lines.append(f"- [📄 {pdf.stem}]({url})")
              lines.extend([end_marker, ""])

              post.write_text(
                  before + "\n".join(lines) + after,
                  encoding="utf-8"
              )
              print(f"Added {len(pdfs)} PDFs to {post}")
          PY
      
      - name: Validate generated Hugo front matter
        shell: bash
        run: |
          set -euo pipefail
          for file in site-source/site/content/posts/*.md; do
            [ -f "$file" ] || continue
            echo "Checking $file"
            sed -n '1,20p' "$file"

            python3 - "$file" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()

          if not lines or lines[0].strip() != "---":
              raise SystemExit(f"ERROR: {path} does not start with YAML front matter")

          if not any(line.strip() == "---" for line in lines[1:]):
              raise SystemExit(f"ERROR: {path} has no closing --- delimiter")

          print(f"Front matter delimiters found: {path}")
          PY
          done


      - name: Build Hugo site
        working-directory: site-source/site
        shell: bash
        run: |
          hugo --cleanDestinationDir --minify \
            --baseURL "https://acceushd.github.io/Latex_stuff/"

      - name: Check for development URLs
        working-directory: site-source/site
        run: |
          if grep -R -n -E \
            'livereload\.js|localhost:12345|localhost:1313|file:///' \
            public --include='*.html'; then
            echo "Unexpected development URL found in production HTML"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-source/site/public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4