name: Publish LaTeX to Hugo

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
# Compile the exact source version identified by the tag.
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          path: source

      - name: Resolve document from tag
        id: doc
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%-v*}"
          version="${TAG##*-v}"

          if [[ "$name" == "$TAG" || -z "$version" ]]; then
            echo "Expected tag: filename-vVERSION"
            exit 1
          fi

          file="latex_files/$name/main.tex"

          if [[ ! -f "source/$file" ]]; then
            echo "Document not found: $file"
            exit 1
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Compile LaTeX with latexmk
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ steps.doc.outputs.file }}
          working_directory: source
          work_in_root_file_dir: true

# The persistent archive is separate from the source branch.
      - name: Check out PDF archive
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: archive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PDF archive
        working-directory: archive
        shell: bash
        env:
          NAME: ${{ steps.doc.outputs.name }}
          VERSION: ${{ steps.doc.outputs.version }}
          FILE: ${{ steps.doc.outputs.file }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p latex_files

          cp "../source/$(dirname "$FILE")/main.pdf" "latex_files/$NAME.pdf"
          cp "../source/$(dirname "$FILE")/main.pdf" "latex_files/$NAME-$VERSION.pdf"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add latex_files/

          if ! git diff --cached --quiet; then
            git commit -m "Publish $NAME $VERSION ($TAG)"
            git push origin HEAD:gh-pages
          fi

# Always build the website using the latest Hugo sources on main.    
      - name: Check out current site source
        uses: actions/checkout@v6
        with:
          ref: main
          path: site-source
          fetch-depth: 0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Copy archived PDFs into Hugo
        shell: bash
        run: |
          mkdir -p site-source/site/static/latex_files
          cp archive/latex_files/*.pdf site-source/site/static/latex_files/

      - name: Generate posts from LaTeX directories
        run: python3 site-source/.github/scripts/generate_hugo_posts.py site-source

      - name: Build Hugo site
        working-directory: site-source/site
        shell: bash
        run: |
          hugo --cleanDestinationDir --minify \
            --baseURL "https://acceushd.github.io/Latex_stuff/"

      - name: Check for development URLs
        working-directory: site-source/site
        run: |
          if grep -R -n -E \
            'livereload\.js|localhost:12345|localhost:1313|file:///' \
            public --include='*.html'; then
            echo "Unexpected development URL found in production HTML"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-source/site/public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4